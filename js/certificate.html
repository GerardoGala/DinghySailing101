<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>

Certificate of Completion

</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet">

<style>

body {

    background:#f5f5f5;

    font-family:Inter,sans-serif;

}

.certificate {

    max-width:900px;

    margin:40px auto;

    background:white;

    border:12px solid #d4af37;

    padding:60px;

    box-shadow:0 0 20px rgba(0,0,0,.15);

}

h1{

    font-family:Cinzel,serif;

    font-size:3rem;

    color:#8b6b00;

}

h2{

    font-family:Cinzel,serif;

}

.student{

    font-size:2rem;

    font-weight:600;

    color:#0d6efd;

    margin:40px 0;

}

.footer{

    margin-top:80px;

}

.signature{

    border-top:1px solid #444;

    display:inline-block;

    padding-top:8px;

    min-width:250px;

}

@media (max-width:768px){

.certificate{

    padding:30px;

    margin:10px;

}

h1{

    font-size:2rem;

}

.student{

    font-size:1.5rem;

}

}

</style>

</head>

<body>

<div class="certificate text-center">

    <h2>

        Misamis University

    </h2>

    <h5>

        Laiya-Aplaya Extension

    </h5>

    <br>

    <h1>

        Certificate of Completion

    </h1>

    <br>

    <p class="lead">

        This certifies that

    </p>

    <div class="student">

        Juan Dela Cruz

    </div>

    <p class="lead">

        has successfully completed the course

    </p>

    <h2>

        Dinghy Sailing 101

    </h2>

    <br>

    <p>

        Awarded this

        <strong>

            7th day of August 2026

        </strong>

    </p>

    <div class="row footer">

        <div class="col">

            <div class="signature">

                Gerardo Gala

            </div>

            <p>

                Instructor

            </p>

        </div>

    </div>

</div>

</body>

</html>
